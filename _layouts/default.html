<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}" data-theme="light">
  {% include head.html %}
  <body class="{% if page.home %}home-page{% endif %}{% if page.page_class %} {{ page.page_class }}{% endif %}">
    <a class="skip-link" href="#content">Skip to the content.</a>
    {% include header.html %}
    <main id="content" class="main-content" role="main">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
