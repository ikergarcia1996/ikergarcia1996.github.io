<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e6f83" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b1118" media="(prefers-color-scheme: dark)">

  {% comment %} Set theme before paint to avoid a flash of the wrong theme {% endcomment %}
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  {% seo %}

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="180x180" href="{{ '/images/favicon-180.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/favicon-180.png' | relative_url }}">
</head>
