<header class="page-header" role="banner"
        style="--banner: url('{{ '/images/Banner_blue.png' | relative_url }}')">
  <div class="header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="project-name">{{ site.title }}</span>
    </a>

    <nav class="site-nav" aria-label="Primary">
      {% for item in site.nav %}
        {% assign target = item.url | relative_url %}
        {% if page.url == item.url or page.url == item.url | append: 'index.html' %}
          {% assign is_active = true %}
        {% else %}
          {% assign is_active = false %}
        {% endif %}
        <a href="{{ target }}" class="nav-link{% if is_active %} is-active{% endif %}"{% if is_active %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}

      <button type="button" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </nav>
  </div>
</header>
